# Full local stack. From repo root:
#   docker compose -f examples/docker-compose.yml up --build
#
# Kafka is reachable on localhost:9092 (host) and kafka:29092 (containers).
# Viewer: http://localhost:3000   Example API: http://localhost:8080

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    ports: ["8123:8123", "9000:9000"]
    environment:
      CLICKHOUSE_DB: anas
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: anas
    volumes:
      - ../docs/sinks/clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password anas --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  example:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: examples/starter-example
    ports: ["8080:8080"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  clickhouse-sink:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: sinks/clickhouse-batch-sink
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:clickhouse:http://clickhouse:8123/anas
      SPRING_DATASOURCE_USERNAME: default
      SPRING_DATASOURCE_PASSWORD: anas
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  duckdb-sink:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: sinks/duckdb-batch-sink
    ports: ["8081:8081"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:duckdb:/data/anas.duckdb
    volumes:
      - duckdb-data:/data
    depends_on:
      kafka:
        condition: service_healthy

  viewer:
    build:
      context: ../viewer
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPICS: orders.events
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: anas
      DUCKDB_SINK_URL: http://duckdb-sink:8081
      EXAMPLE_URL: http://example:8080
    depends_on:
      - kafka
      - clickhouse
      - example
      - clickhouse-sink
      - duckdb-sink

volumes:
  duckdb-data:
